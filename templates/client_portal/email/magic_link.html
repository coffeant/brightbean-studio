<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="margin:0; padding:0; font-family: system-ui, -apple-system, sans-serif; background: #FAFAF9;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 40px 20px;">
        <tr>
            <td align="center">
                <table width="520" cellpadding="0" cellspacing="0" style="background: #FFFFFF; border-radius: 12px; border: 1px solid #E7E5E4; overflow: hidden;">
                    <!-- Header -->
                    <tr>
                        <td style="padding: 32px 32px 0 32px;">
                            <p style="font-size: 15px; font-weight: 700; color: #1C1917; margin: 0;">
                                {{ workspace.name }}
                            </p>
                        </td>
                    </tr>
                    <!-- Body -->
                    <tr>
                        <td style="padding: 24px 32px 32px 32px;">
                            <p style="font-size: 15px; color: #44403C; line-height: 1.6; margin: 0 0 8px 0;">
                                您好，{{ client_user.display_name }}，
                            </p>
                            <p style="font-size: 15px; color: #44403C; line-height: 1.6; margin: 0 0 24px 0;">
                                {{ created_by.display_name }} 分享了内容供您审核。点击下方按钮访问您的门户，批准或对已排期的帖子提供反馈。
                            </p>
                            <!-- CTA Button -->
                            <table cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="center">
                                     <a href="{{ magic_url }}"
                                            style="display: inline-block; padding: 12px 32px; background: #F97316; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; border-radius: 9999px;">
                                            审核帖子
                                        </a>
                                    </td>
                                </tr>
                            </table>
                            <p style="font-size: 13px; color: #A8A29E; line-height: 1.6; margin: 24px 0 0 0;">
                                此链接有效期为30天。如果过期，请向您的客户经理索取新链接。
                            </p>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="padding: 16px 32px; border-top: 1px solid #E7E5E4;">
                            <p style="font-size: 12px; color: #A8A29E; margin: 0;">
                                您收到此邮件是因为您是 {{ workspace.name }} 的客户。
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
