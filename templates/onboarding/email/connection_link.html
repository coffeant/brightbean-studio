<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; background-color: #FAFAF9; color: #1C1917;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #FAFAF9; padding: 40px 20px;">
        <tr>
            <td align="center">
                <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 520px; background: #FFFFFF; border-radius: 12px; border: 1px solid #E7E5E4; overflow: hidden;">
                    <!-- Header -->
                    <tr>
                        <td style="padding: 32px 32px 24px; text-align: center;">
                            <h1 style="margin: 0; font-size: 20px; font-weight: 700; color: #1C1917; letter-spacing: -0.01em;">
                                连接您的社交媒体账户
                            </h1>
                            <p style="margin: 8px 0 0; font-size: 15px; color: #57534E; line-height: 1.5;">
                                {{ org_name }} 邀请您将账户连接到 <strong style="color: #1C1917;">{{ workspace_name }}</strong>。
                            </p>
                        </td>
                    </tr>
                    <!-- CTA button -->
                    <tr>
                        <td style="padding: 0 32px 28px; text-align: center;">
                            <a href="{{ link_url }}" style="
                                display: inline-block;
                                padding: 12px 32px;
                                font-size: 14px; font-weight: 600;
                                color: #FFFFFF; background-color: #F97316;
                                border-radius: 9999px;
                                text-decoration: none;
                                box-shadow: 0 4px 14px rgba(249,115,22,0.28);
                            ">连接账户</a>
                        </td>
                    </tr>
                    <!-- Instructions -->
                    <tr>
                        <td style="padding: 0 32px 24px;">
                            <table width="100%" cellpadding="0" cellspacing="0" style="background: #FAFAF9; border-radius: 8px; padding: 16px;">
                                <tr><td style="padding: 16px; font-size: 13px; color: #57534E; line-height: 1.7;">
                                    <strong style="color: #1C1917;">操作说明：</strong><br>
                                    1. 您将看到可连接的平台列表。<br>
                                    2. 点击每个平台旁的"连接"按钮。<br>
                                    3. 完成后点击"完成"以通知您的团队。
                                </td></tr>
                            </table>
                        </td>
                    </tr>
                    <!-- Expiry -->
                    <tr>
                        <td style="padding: 0 32px 28px; text-align: center;">
                            <p style="margin: 0; font-size: 12px; color: #A8A29E;">
                                此链接有效期至 {{ expires_at|date:"Y年m月d日" }}。
                            </p>
                        </td>
                    </tr>
                </table>
                <!-- Footer -->
                <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 520px;">
                    <tr>
                        <td style="padding: 20px 32px; text-align: center;">
                            <p style="margin: 0; font-size: 12px; color: #A8A29E;">
                                由 {{ org_name }} 发送
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
