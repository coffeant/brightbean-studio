{% extends "base.html" %}

{% block title %}SLA 设置 - {{ workspace.name }} - Brightbean{% endblock %}

{% block content %}
<div class="max-w-lg">
    <!-- Header -->
    <div class="flex items-center gap-3 mb-6">
        <a href="{% url 'inbox:feed' workspace_id=workspace.id %}"
           class="text-stone-400 hover:text-stone-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <div>
            <h2 class="text-xl font-semibold text-stone-900 tracking-tight">SLA 设置</h2>
            <p class="text-sm text-stone-500 mt-0.5">为您的收件箱设置响应时间目标。</p>
        </div>
    </div>

    <!-- Form -->
    <div class="bg-white border border-stone-200 rounded-xl p-6" style="box-shadow: var(--shadow-xs);">
        <form method="post">
            {% csrf_token %}
            <div class="space-y-5">
                <!-- Enable toggle -->
                <div class="flex items-center justify-between">
                    <div>
                        <label class="text-[14px] font-semibold text-stone-800">启用 SLA 计时器</label>
                        <p class="text-[12px] text-stone-500 mt-0.5">在未解决的消息上显示倒计时和超时徽章。</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" name="is_active" {% if config.is_active %}checked{% endif %} class="sr-only peer">
                        <div class="w-9 h-5 bg-stone-200 rounded-full peer peer-checked:bg-orange-500 transition-colors after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-full"></div>
                    </label>
                </div>

                <!-- Target time -->
                <div>
                    <label for="id_target_response_minutes" class="block text-[13px] font-semibold text-stone-700 mb-1.5">目标响应时间（分钟）</label>
                    {{ form.target_response_minutes }}
                    <p class="text-[11px] text-stone-400 mt-1">超过此时间的消息将显示"超时"徽章。</p>
                </div>

                <!-- Auto-resolve -->
                <div class="flex items-center justify-between pt-2 border-t border-stone-100">
                    <div>
                        <label class="text-[14px] font-semibold text-stone-800">回复后自动解决</label>
                        <p class="text-[12px] text-stone-500 mt-0.5">发送回复时自动将消息标记为已解决。</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" name="auto_resolve_on_reply" {% if config.auto_resolve_on_reply %}checked{% endif %} class="sr-only peer">
                        <div class="w-9 h-5 bg-stone-200 rounded-full peer peer-checked:bg-orange-500 transition-colors after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-full"></div>
                    </label>
                </div>
            </div>

            <div class="flex items-center gap-3 mt-8 pt-5 border-t border-stone-100">
                <button type="submit"
                        class="inline-flex items-center gap-1.5 px-5 py-2 text-[13px] font-semibold text-white rounded-full transition-all duration-150 cursor-pointer"
                        style="background: var(--primary); box-shadow: var(--shadow-primary);">
                    保存设置
                </button>
                <a href="{% url 'inbox:feed' workspace_id=workspace.id %}"
                    class="text-[13px] font-medium text-stone-500 hover:text-stone-700 transition-colors">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
