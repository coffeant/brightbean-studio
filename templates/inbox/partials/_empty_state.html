<!-- Empty inbox state -->
<div class="flex flex-col items-center justify-center py-16 px-6 text-center">
    <div class="w-16 h-16 rounded-2xl flex items-center justify-center mb-4" style="background: var(--surface-2);">
        <svg class="w-8 h-8" style="color: var(--text-ghost);" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        </svg>
    </div>
    <h3 class="text-sm font-semibold text-stone-800 mb-1">收件箱为空</h3>

    {% if social_accounts %}
    <p class="text-[13px] text-stone-500 max-w-xs leading-relaxed">
        来自您已关联账户的评论、提及和私信将显示在此处。消息每5分钟同步一次。
    </p>
    {% else %}
    <p class="text-[13px] text-stone-500 max-w-xs leading-relaxed mb-4">
        关联您的社交账户以开始在收件箱中接收消息。
    </p>
    <a href="{% url 'social_accounts:connect' workspace_id=workspace.id %}"
       class="inline-flex items-center gap-1.5 px-4 py-1.5 text-[13px] font-semibold text-orange-600 bg-orange-50 border border-orange-200 rounded-full hover:bg-orange-100 hover:border-orange-300 active:bg-orange-100 transition-all duration-150">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        关联账户
    </a>
    {% endif %}

    {% if active_filters.q or active_filters.platform or active_filters.type or active_filters.status or active_filters.sentiment %}
    <div class="mt-4 pt-4 border-t border-stone-100">
        <p class="text-[12px] text-stone-400 mb-2">没有消息符合您当前的筛选条件。</p>
        <a href="{% url 'inbox:feed' workspace_id=workspace.id %}"
           class="text-[12px] font-semibold hover:underline" style="color: var(--primary);">
            清除所有筛选
        </a>
    </div>
    {% endif %}
</div>
